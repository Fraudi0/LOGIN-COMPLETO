spring.application.name=login-seguro
server.port=8080

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:login_seguro}
spring.data.mongodb.auto-index-creation=true

spring.session.store-type=mongodb
spring.session.timeout=30m
spring.session.mongodb.collection-name=sessoes

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.thymeleaf.cache=false

app.tema.nome=${APP_TEMA:padrao}
app.tema.titulo=Login Seguro
app.tema.rodape=Projeto academico - Spring Boot, Thymeleaf e MongoDB Atlas

app.admin.email=${ADMIN_EMAIL:admin@exemplo.com}
app.admin.senha=${ADMIN_SENHA:Admin@12345}

logging.level.org.springframework.security=INFO
